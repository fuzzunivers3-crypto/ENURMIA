<!doctype html>
<!-- ============================================================
     CONECTAR WHATSAPP — se usa una sola vez (o al cambiar de numero).
     Abre el registro insertado de Meta en modo coexistencia: el numero
     de WhatsApp Business sigue en el telefono y ademas lo atiende el bot.
     Al terminar, manda el "code" de Meta a la funcion whatsapp-alta.
     Se abre en https://www.enurmia.dpdns.org/conectar-whatsapp (Facebook
     exige https; el dominio esta en "Dominios admitidos para el SDK de
     JavaScript" de la app). No lleva claves: la funcion solo acepta el
     numero de ENURMIA (WHATSAPP_NUMERO).
     ============================================================ -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Conectar WhatsApp — ENURMIA</title>
<style>
  body{ font:16px/1.5 system-ui, sans-serif; max-width:560px; margin:48px auto; padding:0 16px; color:#222; background:#fff; }
  h1{ font-size:22px; }
  button{ font:inherit; font-weight:700; padding:12px 20px; border:0; border-radius:8px; background:#1877f2; color:#fff; cursor:pointer; }
  button:disabled{ opacity:.5; cursor:default; }
  #estado{ margin-top:20px; padding:12px; border-radius:8px; background:#f2f4f7; white-space:pre-wrap; }
  .ok{ background:#e7f6ec !important; } .mal{ background:#fdecec !important; }
</style>
</head>
<body>
<h1>Conectar el WhatsApp de ENURMIA al asistente</h1>
<ol>
  <li>Pulsa el botón e inicia sesión con tu Facebook.</li>
  <li>Elige el porfolio <b>Enurmia</b> y la opción de <b>conectar tu app WhatsApp Business existente</b>.</li>
  <li>Escanea con WhatsApp Business del teléfono el código QR que te muestre Meta.</li>
</ol>
<button id="conectar" disabled>Conectar WhatsApp Business</button>
<div id="estado">Cargando…</div>

<script>
  const APP_ID = '1595500451476599';
  const CONFIG_ID = '1120625347101890';
  const ALTA = 'https://msxvpyddpqxmnhosgxnw.supabase.co/functions/v1/whatsapp-alta';
  const $estado = document.getElementById('estado');
  const $boton = document.getElementById('conectar');
  const estado = (t, clase) => { $estado.textContent = t; $estado.className = clase || ''; };

  let code = null, datos = null;

  // Meta avisa por postMessage de la cuenta y el numero elegidos.
  window.addEventListener('message', (e) => {
    if (!/(^|\.)facebook\.com$/.test(new URL(e.origin).hostname)) return;
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m?.type !== 'WA_EMBEDDED_SIGNUP') return;
    console.log('[alta] evento', m.event, m.data);
    if (/^FINISH/.test(m.event)) { datos = m.data; enviar(); }
    else if (m.event === 'CANCEL') estado('Se canceló en el paso: ' + (m.data?.current_step || '?'), 'mal');
    else if (m.event === 'ERROR') estado('Meta dio un error: ' + (m.data?.error_message || ''), 'mal');
  });

  async function enviar() {
    if (!code || !datos) return; // esperar a tener las dos cosas
    estado('Guardando la conexión…');
    try {
      const r = await fetch(ALTA, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, waba_id: datos.waba_id, phone_number_id: datos.phone_number_id }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      estado('¡Listo! El asistente ya atiende ' + (j.telefono || 'el número') + (j.nombre ? ' (' + j.nombre + ')' : '') + '.', 'ok');
    } catch (err) {
      estado('No se pudo guardar: ' + err.message, 'mal');
    }
  }

  window.fbAsyncInit = () => {
    FB.init({ appId: APP_ID, autoLogAppEvents: true, xfbml: false, version: 'v23.0' });
    $boton.disabled = false;
    estado('Listo para conectar.');
  };

  $boton.onclick = () => {
    estado('Sigue los pasos en la ventana de Meta…');
    FB.login((resp) => {
      if (resp.authResponse?.code) { code = resp.authResponse.code; enviar(); }
      else estado('No se completó el inicio de sesión con Meta.', 'mal');
    }, {
      config_id: CONFIG_ID,
      response_type: 'code',
      override_default_response_type: true,
      extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' },
    });
  };
</script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_LA/sdk.js"></script>
</body>
</html>
